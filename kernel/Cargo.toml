[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader_api = "0.11"
spin = "0.12.2"
x86_64 = "0.15.5"
pic8259 = "0.11.0"
noto-sans-mono-bitmap = "0.3.2"
pc-keyboard = "0.9.0"

[dependencies.lazy_static]
version = "1.5.0"
features = ["spin_no_std"]

[[bin]]
name = "kernel"
test = false
bench = false

[build-dependencies]
bootloader = { version = "0.11", default-features = false, features = ["uefi"] }
